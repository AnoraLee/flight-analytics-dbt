name: dbt CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dbt_build_and_test:
    name: Build & Test dbt Models on Snowflake
    runs-on: ubuntu-latest

    env:
      SF_ACCOUNT: ${{ secrets.SF_ACCOUNT }}
      SF_USER: ${{ secrets.SF_USER }}
      SF_PASS: ${{ secrets.SF_PASS }}
      SF_ROLE: ${{ secrets.SF_ROLE || 'ACCOUNTADMIN' }}
      SF_DB: ${{ secrets.SF_DB || 'FLIGHTS_DW' }}
      SF_WH: ${{ secrets.SF_WH || 'COMPUTE_WH' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dbt profiles.yml
        run: |
          cat << 'EOF' > transform/profiles.yml
          flight_dbt:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: "{{ env_var('SF_ACCOUNT') }}"
                user: "{{ env_var('SF_USER') }}"
                password: "{{ env_var('SF_PASS') }}"
                role: "{{ env_var('SF_ROLE', 'ACCOUNTADMIN') }}"
                database: "{{ env_var('SF_DB', 'FLIGHTS_DW') }}"
                warehouse: "{{ env_var('SF_WH', 'COMPUTE_WH') }}"
                schema: PUBLIC
                threads: 4
          EOF

      - name: Install dbt packages
        run: dbt deps --project-dir transform --profiles-dir transform

      - name: Validate dbt project structure
        run: dbt parse --project-dir transform --profiles-dir transform

      - name: Run dbt models and data quality tests on Snowflake
        if: env.SF_ACCOUNT != '' && env.SF_USER != '' && env.SF_PASS != ''
        run: |
          dbt run --project-dir transform --profiles-dir transform
          dbt test --project-dir transform --profiles-dir transform
